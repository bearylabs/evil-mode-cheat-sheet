<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body>
    <main>
      <h1>{{ site.title }}</h1>
      <div class="search" hidden>
        <input type="search" id="filter" placeholder="Search" autocomplete="off" spellcheck="false">
        <kbd class="hint">/</kbd>
      </div>
      <div class="sheet">
        {{ content }}
      </div>
      <p class="empty" hidden>No matches.</p>
    </main>
    <script src="assets/filter.js"></script>
  </body>
</html>
